<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="Omenra">
  <style>
    .orbit { transform-origin: 32px 32px; animation: orbit 26s linear infinite; }
    .craft { transform-origin: 32px 23px; animation: level 26s linear infinite; }
    .orbit, .craft { transform-box: view-box; }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes level { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbit, .craft { animation: none; } }
  </style>

  <defs>
    <clipPath id="sky"><circle cx="32" cy="32" r="23.5" /></clipPath>
  </defs>

  <circle cx="32" cy="32" r="32" fill="#3b5bff" />
  <circle cx="32" cy="32" r="23.5" fill="#0b1020" />
  <circle cx="24.5" cy="26.5" r="1" fill="#d7dcea" />
  <circle cx="43.5" cy="35.5" r="1" fill="#d7dcea" />
  <circle cx="31" cy="45" r=".8" fill="#aab4cc" />
  <circle cx="40" cy="22.5" r=".7" fill="#b9c2d6" />

  <g class="orbit" clip-path="url(#sky)">
    <g class="craft">
      <g transform="translate(32 23) scale(1.3)">
        <path d="M -2.6 4.6 C -4.6 5.4 -6.2 6.4 -5.6 7.6"
              fill="none" stroke="#cf9a63" stroke-width=".85"
              stroke-linecap="round" stroke-opacity=".9" />
        <rect x="-4" y="-2.5" width="2.6" height="5.6" rx="1" fill="#c8d0e0" />
        <rect x="-2.2" y="-2.6" width="4.6" height="5.8" rx="1.8" fill="#f5f6f8" />
        <rect x="-5.1" y="-.7" width="2.8" height="1.7" rx=".85" fill="#e4e9f2" />
        <rect x="2.3" y="-1.6" width="2.8" height="1.7" rx=".85" fill="#e4e9f2" />
        <rect x="-1.8" y="2.6" width="1.9" height="3.1" rx=".95" fill="#eef1f6" />
        <rect x=".3" y="2.4" width="1.9" height="3.3" rx=".95" fill="#eef1f6" />
        <circle cx="0" cy="-4" r="2.7" fill="#f5f6f8" />
        <ellipse cx="0" cy="-3.9" rx="1.75" ry="1.5" fill="#16204a" />
      </g>
    </g>
  </g>
</svg>
